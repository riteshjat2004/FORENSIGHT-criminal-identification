# Render managed (non-Docker) service descriptor for Python environment
# Use this if you want Render to install Python packages directly (no Docker).
# Note: Large packages like TensorFlow/DeepFace may still fail on managed builds.

services:
  - type: web
    name: forensight-backend-managed
    env: python
    rootDirectory: Backend
    branch: main
    plan: starter
    autoDeploy: true
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT -w 4
    envVars:
      - key: MONGO_CONNECTION_STRING
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: FLASK_SECRET_KEY
      - key: ADMIN_SECRET_KEY
      - key: ALLOWED_ORIGINS
