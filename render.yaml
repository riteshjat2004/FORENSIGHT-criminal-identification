# Render service descriptor for Docker-based deployment
# Edit names and branch as needed before creating the service in Render.

services:
  - type: web
    name: forensight-backend
    env: docker
    dockerfilePath: Backend/Dockerfile
    branch: main
    plan: starter
    autoDeploy: true
    startCommand: gunicorn app:app -b 0.0.0.0:$PORT -w 4
    envVars:
      - key: MONGO_CONNECTION_STRING
      - key: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
      - key: FLASK_SECRET_KEY
      - key: ADMIN_SECRET_KEY
      - key: ALLOWED_ORIGINS
