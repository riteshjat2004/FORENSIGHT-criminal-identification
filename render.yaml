# Render Blueprint deployment specification for FORENSIGHT Backend
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forensight-backend
    env: python
    rootDirectory: Backend
    branch: main
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    buildCommand: python -m pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: MALLOC_ARENA_MAX=2 gunicorn app:app -b 0.0.0.0:$PORT -w 1 --threads 1 --timeout 180
    envVars:
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: TF_USE_LEGACY_KERAS
        value: "1"
      - key: MONGO_CONNECTION_STRING
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MATCH_THRESHOLD
        value: "0.3"
      - key: FACE_MODEL
        value: "Facenet512"
      - key: FACE_DETECTOR
        value: "opencv"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TF_NUM_INTRAOP_THREADS
        value: "1"
      - key: TF_NUM_INTEROP_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
